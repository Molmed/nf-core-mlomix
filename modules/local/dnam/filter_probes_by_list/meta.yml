name: "filter_probes_by_list"
description: Filter beta values to probes listed in a supplied CpG/probe list
keywords:
  - methylation
  - probes
  - filtering
  - reference list
tools:
  - pandas:
      description: |
        Python data analysis library used for reading, filtering, and
        deduplicating the beta value matrix.
      homepage: https://pandas.pydata.org/
      licence: ["BSD-3-Clause"]

input:
  - - betas:
        type: file
        description: |
          Tab-separated file of beta values with probe_id as the first column
          and sample names as remaining columns.
        pattern: "*.tsv"
  - - probe_list:
        type: file
        description: |
          Text file with one CpG site per line.
        pattern: "*.txt"

output:
  - filtered_betas:
      - "filtered_betas.tsv":
          type: file
          description: |
            Tab-separated file of beta values filtered to only probes in the
            supplied list.
          pattern: "filtered_betas.tsv"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@methylml"
maintainers:
  - "@methylml"
