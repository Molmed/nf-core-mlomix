name: "class_filter_and_report"
description: Filter samples by minimum class counts per modality and generate before/after reports
keywords:
  - samplesheet
  - class
  - distribution
  - report
tools:
  - pandas:
      description: Python data analysis library used for reading the samplesheet and computing class distributions.
      homepage: https://pandas.pydata.org/
      licence: ["BSD-3-Clause"]
  - matplotlib:
      description: Python plotting library used for generating class distribution bar charts.
      homepage: https://matplotlib.org/
      licence: ["PSF-2.0"]

input:
  - - samplesheet:
        type: file
        description: Samplesheet in CSV or TSV format containing an optional class column.
        pattern: "*.{csv,tsv}"

output:
  - class_plot_gex_all:
    - "class_distribution.gex.all.svg":
      type: file
      description: Bar chart of the class distribution for GEX samples (all)
      pattern: "class_distribution.gex.all.svg"
  - class_plot_gex_filtered:
    - "class_distribution.gex.filtered.svg":
      type: file
      description: Bar chart of the class distribution for GEX samples (filtered)
      pattern: "class_distribution.gex.filtered.svg"
  - class_plot_dnam_all:
    - "class_distribution.dnam.all.svg":
      type: file
      description: Bar chart of the class distribution for DNAM samples (all)
      pattern: "class_distribution.dnam.all.svg"
  - class_plot_dnam_filtered:
    - "class_distribution.dnam.filtered.svg":
      type: file
      description: Bar chart of the class distribution for DNAM samples (filtered)
      pattern: "class_distribution.dnam.filtered.svg"
  - classes_gex_all:
    - "classes.gex.all.tsv":
      type: file
      description: TSV file with the count of GEX samples per class (all)
      pattern: "classes.gex.all.tsv"
  - classes_gex_filtered:
    - "classes.gex.filtered.tsv":
      type: file
      description: TSV file with the count of GEX samples per class (filtered)
      pattern: "classes.gex.filtered.tsv"
  - classes_dnam_all:
    - "classes.dnam.all.tsv":
      type: file
      description: TSV file with the count of DNAM samples per class (all)
      pattern: "classes.dnam.all.tsv"
  - classes_dnam_filtered:
    - "classes.dnam.filtered.tsv":
      type: file
      description: TSV file with the count of DNAM samples per class (filtered)
      pattern: "classes.dnam.filtered.tsv"
  - samplesheet_filtered:
    - "samplesheet.filtered.tsv":
      type: file
      description: Filtered samplesheet with samples that meet minimum class thresholds
      pattern: "samplesheet.filtered.tsv"
  - kept_sample_ids:
    - "kept_sample_ids.txt":
      type: file
      description: Plain text file with one sample ID per line for samples that passed filtering
      pattern: "kept_sample_ids.txt"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@methylml"
maintainers:
  - "@methylml"
