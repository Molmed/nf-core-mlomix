name: "class_reporter"
description: Extract sample class distribution from the input samplesheet and generate a report
keywords:
  - samplesheet
  - class
  - distribution
  - report
tools:
  - pandas:
      description: Python data analysis library used for reading the samplesheet and computing class distributions.
      homepage: https://pandas.pydata.org/
      licence: ["BSD-3-Clause"]
  - matplotlib:
      description: Python plotting library used for generating class distribution bar charts.
      homepage: https://matplotlib.org/
      licence: ["PSF-2.0"]

input:
  - - samplesheet:
        type: file
        description: Samplesheet in CSV or TSV format containing an optional class column.
        pattern: "*.{csv,tsv}"

output:
  - class_plot_gex:
    - "class_distribution.gex.svg":
      type: file
      description: Bar chart of the class distribution for GEX samples
      pattern: "class_distribution.gex.svg"
  - class_plot_dnam:
    - "class_distribution.dnam.svg":
      type: file
      description: Bar chart of the class distribution for DNAM samples
      pattern: "class_distribution.dnam.svg"
  - classes_gex:
    - "classes.gex.tsv":
      type: file
      description: TSV file with the count of GEX samples per class
      pattern: "classes.gex.tsv"
  - classes_dnam:
    - "classes.dnam.tsv":
      type: file
      description: TSV file with the count of DNAM samples per class
      pattern: "classes.dnam.tsv"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@methylml"
maintainers:
  - "@methylml"
